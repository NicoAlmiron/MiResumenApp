# Blueprint de Render para el frontend (sitio estático).
#
# VITE_API_URL abajo asume que el backend queda en https://miresumenapi.onrender.com
# (nombre de servicio "miresumenapi" en el render.yaml de MiResumenAPI). Si
# Render le asignó otra URL a ese servicio, hay que actualizar esta env var
# acá y volver a deployar (Vite la usa en build time, no en runtime).
#
# La ruta "rewrite" es necesaria porque la app usa BrowserRouter (rutas del
# lado del cliente) — sin esto, refrescar en /resumenes o cualquier ruta que
# no sea "/" da 404 en el hosting estático.
services:
  - type: web
    name: miresumenapp
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://miresumenapi.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
